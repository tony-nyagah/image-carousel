<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- black background -->
  <rect width="32" height="32" fill="#0d0d0d"/>

  <!-- the slide (yellow) -->
  <rect x="5" y="4" width="22" height="17" fill="#ffe600"/>

  <!-- simple landscape inside the slide -->
  <polygon points="5,21 10,14 14,18 18,12 27,21" fill="#0d0d0d" opacity="0.35"/>

  <!-- left chevron -->
  <polyline points="4.5,14.5 2,12 4.5,9.5"
    stroke="#fff" stroke-width="2" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right chevron -->
  <polyline points="27.5,9.5 30,12 27.5,14.5"
    stroke="#fff" stroke-width="2" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- indicator dots (squares, neubrutalist) — middle one is active -->
  <rect x="10" y="25" width="3" height="3" fill="#555"/>
  <rect x="14.5" y="25" width="3" height="3" fill="#ffe600"/>
  <rect x="19" y="25" width="3" height="3" fill="#555"/>
</svg>
